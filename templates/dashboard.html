<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI';
            background: #f4f6f9;
        }

        .navbar {
            background: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
        }

        .container {
            display: flex;
        }

        .sidebar {
            width: 220px;
            background: #34495e;
            height: 100vh;
            padding-top: 20px;
        }

        .sidebar a {
            display: block;
            color: white;
            padding: 12px;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #1abc9c;
        }

        .content {
            flex: 1;
            padding: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #ccc;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            background: #1abc9c;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #16a085;
        }
    </style>
</head>

<body>

<div class="navbar">
    🎓 College Attendance System
</div>

<div class="container">

    <div class="sidebar">
        <a href="/dashboard/">🏠 Dashboard</a>
        <a href="/attendance/view">📊 View Attendance</a>
        <a href="#">📚 Courses</a>
        <a href="/auth/logout">🚪 Logout</a>
    </div>

    <div class="content">

        <div class="card">
            <h2>Welcome, Student 👋</h2>
            <p>Mark your attendance for today.</p>

            <form action="/attendance/mark" method="POST">
                <button type="submit">Mark Attendance</button>
            </form>
        </div>

        <div class="card">
            <h3>Quick Info</h3>
            <p>✔ Attendance system running successfully</p>
            <p>✔ Connected to database</p>
        </div>

    </div>

</div>

</body>
</html>
