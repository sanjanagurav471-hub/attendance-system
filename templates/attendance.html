<!DOCTYPE html>
<html>
<head>
    <title>Attendance Records</title>

    <style>
        body {
            font-family: 'Segoe UI';
            background: #f4f6f9;
        }

        h2 {
            text-align: center;
            margin-top: 20px;
        }

        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0px 0px 10px gray;
        }

        th {
            background: #2c3e50;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
            text-align: center;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }

        .present {
            color: green;
            font-weight: bold;
        }

        .btn {
            display: block;
            width: 200px;
            margin: 20px auto;
            padding: 10px;
            background: #1abc9c;
            color: white;
            text-align: center;
            border-radius: 5px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<h2>📊 Attendance Records</h2>

<table>
    <tr>
        <th>ID</th>
        <th>User</th>
        <th>Course</th>
        <th>Date</th>
        <th>Check-In</th>
        <th>Status</th>
        <th>Action</th>
        
    </tr>

    {% for r in records %}
    <tr>
        <td>{{ r.id }}</td>
        <td>{{ r.user.username }}</td>
        <td>{{ r.course.name }}</td>
        <td>{{ r.date }}</td>
        <td>{{ r.check_in_time }}</td>
        <td class="present">{{ r.status }}</td>

<td>
    <form action="/attendance/delete/{{ r.id }}" method="POST">
        <button style="background:red; color:white; padding:5px 10px; border:none; border-radius:5px;">
            Delete
        </button>
    </form>
</td>
    {% endfor %}
</table>

<a class="btn" href="/dashboard/">⬅ Back to Dashboard</a>

</body>
</html>
